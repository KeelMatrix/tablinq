<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fake ChatGPT</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(160deg, #f4f7fb 0%, #dce7f2 100%);
        color: #12202f;
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .shell,
      .stacked-shell {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(18, 32, 47, 0.1);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(18, 32, 47, 0.14);
        overflow: hidden;
      }

      .toolbar,
      .composer,
      .stacked-toolbar,
      .stacked-composer {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px 20px;
      }

      .toolbar,
      .stacked-toolbar {
        border-bottom: 1px solid rgba(18, 32, 47, 0.08);
        flex-wrap: wrap;
      }

      button,
      select,
      textarea,
      [contenteditable="true"] {
        font: inherit;
      }

      textarea,
      [contenteditable="true"] {
        flex: 1;
        min-height: 112px;
        border-radius: 18px;
        border: 1px solid rgba(18, 32, 47, 0.12);
        padding: 14px 16px;
        background: #ffffff;
      }

      [contenteditable="true"] {
        white-space: pre-wrap;
      }

      .transcript {
        padding: 20px;
        border-top: 1px solid rgba(18, 32, 47, 0.08);
      }

      .message {
        padding: 16px;
        border-radius: 16px;
        background: #ffffff;
        border: 1px solid rgba(18, 32, 47, 0.08);
      }

      .variant-note {
        margin-bottom: 18px;
        opacity: 0.78;
      }

      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(18, 32, 47, 0.12);
        background: #fff;
      }
    </style>
  </head>
  <body data-ui-variant="classic">
    <main>
      <h1>Fake ChatGPT Harness</h1>
      <p class="variant-note" id="variant-note">
        Local harness for capability probing and browser adapter tests.
      </p>
      <section id="app-root" aria-label="fake-chatgpt-shell"></section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
