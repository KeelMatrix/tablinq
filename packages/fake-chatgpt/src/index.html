<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fake ChatGPT</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(160deg, #f4f7fb 0%, #dce7f2 100%);
        color: #12202f;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .shell {
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(18, 32, 47, 0.1);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(18, 32, 47, 0.14);
        overflow: hidden;
      }

      .toolbar,
      .composer {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px 20px;
      }

      .toolbar {
        border-bottom: 1px solid rgba(18, 32, 47, 0.08);
      }

      button,
      select,
      textarea {
        font: inherit;
      }

      textarea {
        flex: 1;
        min-height: 112px;
        border-radius: 18px;
        border: 1px solid rgba(18, 32, 47, 0.12);
        padding: 14px 16px;
        resize: vertical;
      }

      .transcript {
        padding: 20px;
        border-top: 1px solid rgba(18, 32, 47, 0.08);
      }

      .message {
        padding: 16px;
        border-radius: 16px;
        background: #ffffff;
        border: 1px solid rgba(18, 32, 47, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fake ChatGPT Harness</h1>
      <p>
        Minimal DOM for capability probes, prompt submission, uploads, and
        artifact links.
      </p>
      <section class="shell" aria-label="fake-chatgpt-shell">
        <div class="toolbar">
          <button
            type="button"
            data-slot="model-picker"
            aria-haspopup="listbox"
          >
            GPT-5.4 Thinking
          </button>
          <button type="button" data-mode="search">Search</button>
          <button type="button" data-mode="research">Research</button>
          <button type="button" data-slot="effort-toggle">Standard</button>
          <button type="button" data-slot="upload-entry">Attach</button>
        </div>
        <div class="composer">
          <textarea
            aria-label="Prompt composer"
            data-slot="composer"
            placeholder="Ask fake ChatGPT something"
          ></textarea>
          <button type="button" data-action="submit">Send</button>
        </div>
        <div class="transcript">
          <article class="message" data-slot="assistant-message">
            <p>Streaming output lands here.</p>
            <a href="/artifact.txt" download data-slot="artifact-link"
              >artifact.txt</a
            >
          </article>
        </div>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
