[workspace]
members = [
  "crates/gpt",
  "crates/gptd",
  "crates/shared-protocol",
  "crates/tablinq-gateway",
  "crates/tablinq-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive"] }
interprocess = "2.4.0"
proptest = "1.9.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.12"
toml = "0.9.7"
