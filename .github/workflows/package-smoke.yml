name: Package Smoke

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  CI: true

jobs:
  windows-package:
    name: Windows package smoke
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build package layout
        shell: pwsh
        run: ./scripts/package.ps1 -Profile dev

      - name: Run Windows packaging smoke test
        env:
          TABLINQ_PACKAGE_ROOT: ${{ github.workspace }}\dist\package\tablinq
        run: cargo test -p gpt --test production_smoke windows_packaging_and_install_smoke_cover_packaged_layout -- --nocapture

      - name: Upload package artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tablinq-windows-package
          path: dist/package/tablinq
          if-no-files-found: error
          retention-days: 7
